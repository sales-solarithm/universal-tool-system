</div>

function loadTool() {
  try {
    const html = decodeURIComponent(escape(atob(TOOL_HTML_B64)));
    const frame = document.getElementById('tool-frame');
    frame.srcdoc = html;
    frame.onload = function() {
      toolReady = true;

      // Inject fallback toolAPI if tool doesn't provide one
      try {
        const fw = frame.contentWindow;
        if (!fw.toolAPI) {
          fw.toolAPI = {
            getState: function() {
              // Fallback: collect all input/textarea/select values + body HTML snapshot
              const inputs = {};
              fw.document.querySelectorAll('input, textarea, select').forEach(function(el, i) {
                const key = el.id || el.name || ('el_' + i);
                inputs[key] = el.type === 'checkbox' ? el.checked : el.value;
              });
              return {
                _fallback: true,
                inputs: inputs,
                meta: { toolId: TOOL_ID, version: TOOL_VERSION, timestamp: Date.now() }
              };
            },
            loadState: function(data) {
              if (!data || !data._fallback) return;
              const inputs = data.inputs || {};
              fw.document.querySelectorAll('input, textarea, select').forEach(function(el, i) {
                const key = el.id || el.name || ('el_' + i);
                if (key in inputs) {
                  if (el.type === 'checkbox') {
                    el.checked = inputs[key];
                  } else {
                    el.value = inputs[key];
                  }
                  // Trigger change event so tool reacts
                  try { el.dispatchEvent(new Event('input', { bubbles: true })); } catch(e) {}
                  try { el.dispatchEvent(new Event('change', { bubbles: true })); } catch(e) {}
                }
              });
            },
            beforeSave: function() { return true; },
            afterLoad: function() {}
          };
          setStatus('Tool loaded (using fallback serializer)');
        } else {
          setStatus('Tool loaded');
        }
      } catch(e) {
        setStatus('Tool loaded (cross-origin fallback mode)');
      }

      // Auto-load last active project
      const last = localStorage.getItem(STORAGE_KEY_PREFIX + '::activeProject');
      if (last) {
        activeProject = last;
        document.getElementById('proj-name-input').value = last;
        loadProject(last);
      }

      // Start auto-save
      if (AUTO_SAVE) {
        autoSaveTimer = setInterval(function() {
          silentSave();
        }, 60000);
      }
    };
  } catch(e) {
    setStatus('Error loading tool: ' + e.message, true);
  }
}

// ── Storage Abstraction ──────────────────────────────────────────
const storage = {
  key: function(projectId) {
    return STORAGE_KEY_PREFIX + '::proj::' + projectId;
  },
  indexKey: function() {
    return STORAGE_KEY_PREFIX + '::projects';
  },

  save: async function(projectId, data) {
    const payload = JSON.stringify({
      id: projectId,
      toolId: TOOL_ID,
      version: TOOL_VERSION,
      savedAt: new Date().toISOString(),
      state: data
    });

    // Try Cloudflare KV (via worker) if available
    if (USE_KV && AUTH_CONFIG.workerUrl && AUTH_CONFIG.sessionToken) {
      try {
        const r = await fetch(AUTH_CONFIG.workerUrl + '/kv/set', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'X-Session-Token': AUTH_CONFIG.sessionToken
          },
          body: JSON.stringify({ key: this.key(projectId), value: payload })
        });
        if (r.ok) {
          this._updateIndex(projectId);
          return true;
        }
      } catch(e) { /* fall through to localStorage */ }
    }

    // localStorage fallback
    try {
      localStorage.setItem(this.key(projectId), payload);
      this._updateIndex(projectId);
      return true;
    } catch(e) {
      if (e.name === 'QuotaExceededError') throw new Error('Storage full. Delete old projects to free space.');
      throw e;
    }
  },

  load: async function(projectId) {
    // Try KV first
    if (USE_KV && AUTH_CONFIG.workerUrl && AUTH_CONFIG.sessionToken) {
      try {
        const r = await fetch(AUTH_CONFIG.workerUrl + '/kv/get?key=' + encodeURIComponent(this.key(projectId)), {
          headers: { 'X-Session-Token': AUTH_CONFIG.sessionToken }
        });
        if (r.ok) {
          const d = await r.json();
          if (d.value) return JSON.parse(d.value);
        }
      } catch(e) { /* fall through */ }
    }

    // localStorage fallback
    const raw = localStorage.getItem(this.key(projectId));
    return raw ? JSON.parse(raw) : null;
  },

  list: function() {
    const raw = localStorage.getItem(this.indexKey());
    return raw ? JSON.parse(raw) : [];
  },

  delete: function(projectId) {
    localStorage.removeItem(this.key(projectId));
    const idx = this.list().filter(function(p) { return p.id !== projectId; });
    localStorage.setItem(this.indexKey(), JSON.stringify(idx));
  },

  _updateIndex: function(projectId) {
    const idx = this.list();
    const existing = idx.findIndex(function(p) { return p.id === projectId; });
    const entry = { id: projectId, savedAt: new Date().toISOString() };
    if (existing >= 0) idx[existing] = entry;
    else idx.push(entry);
    localStorage.setItem(this.indexKey(), JSON.stringify(idx));
  }
};

// ── Project Operations ───────────────────────────────────────────
async function saveProject(silent) {
  if (!toolReady) { showToast('Tool not ready yet.', 'error'); return; }

  const projName = document.getElementById('proj-name-input').value.trim() || 'Default';
  activeProject = projName;

  try {
    const frame = document.getElementById('tool-frame');
    let state = null;

    try {
      const api = frame.contentWindow.toolAPI;
      if (api && typeof api.beforeSave === 'function') {
        const ok = api.beforeSave();
        if (ok === false) { showToast('Save cancelled by tool.', 'error'); return; }
      }
      if (api && typeof api.getState === 'function') {
        state = api.getState();
      }
    } catch(e) {
      state = { _error: 'Could not read tool state: ' + e.message };
    }

    await storage.save(projName, state);
    localStorage.setItem(STORAGE_KEY_PREFIX + '::activeProject', projName);
    lastSavedTime = new Date();
    updateTimeDisplay();
    if (!silent) {
      showToast('Saved: ' + projName, 'success');
      setStatus('Saved "' + projName + '"');
    }
    renderProjectList();
    renderProjectSelect();
  } catch(e) {
    showToast('Save failed: ' + e.message, 'error');
  }
}

async function loadProject(projectId) {
  if (!toolReady) { setTimeout(function() { loadProject(projectId); }, 300); return; }

  try {
    const saved = await storage.load(projectId);
    if (!saved) { showToast('Project "' + projectId + '" not found.', 'error'); return; }

    const frame = document.getElementById('tool-frame');
    try {
      const api = frame.contentWindow.toolAPI;
      if (api && typeof api.loadState === 'function') {
        api.loadState(saved.state);
        if (typeof api.afterLoad === 'function') api.afterLoad();
      }
    } catch(e) {
      setStatus('Could not restore state: ' + e.message, true);
      return;
    }

    activeProject = projectId;
    document.getElementById('proj-name-input').value = projectId;
    localStorage.setItem(STORAGE_KEY_PREFIX + '::activeProject', projectId);
    showToast('Loaded: ' + projectId, 'success');
    setStatus('Loaded "' + projectId + '"');
    renderProjectList();
  } catch(e) {
    showToast('Load failed: ' + e.message, 'error');
  }
}

function switchProject(projectId) {
  if (!projectId) return;
  loadProject(projectId);
  document.getElementById('proj-select').value = '';
}

function newProject() {
  const name = prompt('New project name:', 'Project ' + (storage.list().length + 1));
  if (!name) return;
  document.getElementById('proj-name-input').value = name.trim();
  activeProject = name.trim();
  showToast('Project "' + name + '" created. Click Save to store state.', 'success');
}

function deleteProject(projectId, event) {
  event.stopPropagation();
  if (!confirm('Delete project "' + projectId + '"?')) return;
  storage.delete(projectId);
  if (activeProject === projectId) {
    activeProject = 'Default';
    document.getElementById('proj-name-input').value = 'Default';
  }
  renderProjectList();
  renderProjectSelect();
  showToast('Deleted: ' + projectId);
}

async function silentSave() {
  await saveProject(true);
  setStatus('Auto-saved at ' + new Date().toLocaleTimeString());
}

// ── Export / Import ──────────────────────────────────────────────
async function exportState() {
  if (!toolReady) { showToast('Tool not ready.', 'error'); return; }

  let state = null;
  try {
    const api = document.getElementById('tool-frame').contentWindow.toolAPI;
    if (api && typeof api.getState === 'function') state = api.getState();
  } catch(e) {}

  const bundle = {
    _toolforge: true,
    toolId: TOOL_ID,
    toolName: 'PDF Generetor Pro',
    version: TOOL_VERSION,
    projectName: activeProject,
    exportedAt: new Date().toISOString(),
    state: state
  };

  const blob = new Blob([JSON.stringify(bundle, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = TOOL_ID + '-' + activeProject.replace(/[^a-z0-9]/gi, '-') + '-' + Date.now() + '.json';
  a.click();
  URL.revokeObjectURL(a.href);
  showToast('Exported: ' + a.download, 'success');
}

function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = async function(e) {
    try {
      const data = JSON.parse(e.target.result);
      if (!data._toolforge) { showToast('Not a ToolForge export file.', 'error'); return; }

      const frame = document.getElementById('tool-frame');
      const api = frame.contentWindow.toolAPI;
      if (api && typeof api.loadState === 'function') {
        api.loadState(data.state);
        if (typeof api.afterLoad === 'function') api.afterLoad();
      }

      if (data.projectName) {
        document.getElementById('proj-name-input').value = data.projectName;
        activeProject = data.projectName;
      }

      showToast('Imported: ' + file.name, 'success');
      setStatus('State restored from file');
    } catch(e) {
      showToast('Import failed: ' + e.message, 'error');
    }
    event.target.value = '';
  };
  reader.readAsText(file);
}

// ── Authentication ───────────────────────────────────────────────
async function verifyAuth() {
  const email = document.getElementById('auth-email').value.trim();
  const errEl = document.getElementById('auth-error');
  errEl.textContent = '';

  if (!email || !/^[^@]+@[^@]+\.[^@]+$/.test(email)) {
    errEl.textContent = 'Please enter a valid email address.';
    return;
  }

  // If a dashboard already passed a token via postMessage, use it
  if (AUTH_CONFIG.sessionToken) {
    unlockTool(email);
    return;
  }

  // If worker URL is configured, verify remotely
  if (AUTH_CONFIG.workerUrl) {
    try {
      const r = await fetch(AUTH_CONFIG.workerUrl + '/auth/verify', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email })
      });
      const d = await r.json();
      if (r.ok && d.token) {
        AUTH_CONFIG.sessionToken = d.token;
        unlockTool(email);
      } else {
        errEl.textContent = d.error || 'Access denied.';
      }
    } catch(e) {
      errEl.textContent = 'Could not reach auth server. Check worker URL in settings.';
    }
    return;
  }

  // No worker configured: check localStorage whitelist (offline mode)
  const whitelist = JSON.parse(localStorage.getItem('toolforge::emailWhitelist') || '[]');
  if (whitelist.length === 0 || whitelist.includes(email)) {
    unlockTool(email);
  } else {
    errEl.textContent = 'Email not authorized.';
  }
}

function unlockTool(email) {
  AUTH_CONFIG.userEmail = email;
  AUTH_CONFIG.verified = true;
  document.getElementById('overlay').classList.add('hidden');
  const badge = document.getElementById('auth-badge');
  badge.style.display = 'flex';
  badge.title = 'Logged in as ' + email;
  setStatus('Authenticated as ' + email);
}

// ── Navigation ───────────────────────────────────────────────────
function goBack() {
  // Notify parent dashboard via postMessage
  try { window.parent.postMessage({ type: 'navigate', target: 'dashboard' }, '*'); } catch(e) {}
  // Fallback: go back in history or to index
  if (window.parent !== window) {
    window.parent.postMessage('navigate:dashboard', '*');
  } else if (document.referrer) {
    history.back();
  } else {
    window.location.href = '../index.html';
  }
}

// ── UI Helpers ───────────────────────────────────────────────────
function toggleDrawer() {
  drawerOpen = !drawerOpen;
  document.getElementById('proj-drawer').classList.toggle('open', drawerOpen);
  if (drawerOpen) renderProjectList();
}

function renderProjectList() {
  const projects = storage.list();
  const listEl = document.getElementById('proj-list');
  if (projects.length === 0) {
    listEl.innerHTML = '<p class="empty-state">No saved projects yet.<br>Click 💾 Save to create one.</p>';
    return;
  }
  listEl.innerHTML = projects.map(function(p) {
    const active = p.id === activeProject;
    const date = new Date(p.savedAt).toLocaleString(undefined, { month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' });
    return '<div class="proj-item' + (active ? ' active' : '') + '" onclick="loadProject(\''+p.id+'\')">'+
      '<div class="proj-name">' + escapeHTMLjs(p.id) + (active ? ' ●' : '') + '</div>'+
      '<div class="proj-meta">' + date + '</div>'+
      '<button class="proj-del" onclick="deleteProject(\''+p.id+'\', event)" title="Delete">✕</button>'+
    '</div>';
  }).join('');
}

function renderProjectSelect() {
  const select = document.getElementById('proj-select');
  const projects = storage.list();
  const opts = projects.map(function(p) {
    return '<option value="'+escapeHTMLjs(p.id)+'">'+escapeHTMLjs(p.id)+'</option>';
  }).join('');
  select.innerHTML = '<option value="">Switch project...</option>' + opts;
}

function setStatus(msg, isError) {
  const el = document.getElementById('status-msg');
  el.textContent = msg;
  el.style.color = isError ? '#ba7a7a' : '#666';
}

function updateTimeDisplay() {
  if (lastSavedTime) {
    document.getElementById('status-time').textContent = 'Last saved: ' + lastSavedTime.toLocaleTimeString();
  }
}

function escapeHTMLjs(str) {
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

let toastTimer;
function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function() { t.classList.remove('show'); }, 3200);
}

// ── PostMessage Bridge (dashboard <-> tool) ──────────────────────
window.addEventListener('message', function(event) {
  const d = event.data;
  if (!d || typeof d !== 'object') return;

  // Auth token from dashboard
  if (d.type === 'auth:token' && d.token) {
    AUTH_CONFIG.sessionToken = d.token;
    AUTH_CONFIG.userEmail = d.email || '';
    if (REQUIRE_AUTH && !AUTH_CONFIG.verified) {
      unlockTool(AUTH_CONFIG.userEmail);
    }
  }

  // Load project from dashboard
  if (d.type === 'project:load' && d.projectId) {
    loadProject(d.projectId);
  }

  // Save request from dashboard
  if (d.type === 'project:save') {
    saveProject();
  }
});

// ── Init ─────────────────────────────────────────────────────────
(function init() {
  loadTool();
  renderProjectList();
  renderProjectSelect();

  // Keyboard shortcut: Ctrl+S = Save
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveProject();
    }
  });

  // Update time display every 30s
  setInterval(updateTimeDisplay, 30000);

  // Warn before unload if there are unsaved changes
  window.addEventListener('beforeunload', function(e) {
    if (AUTO_SAVE) return; // auto-save handles this
    e.preventDefault();
    e.returnValue = '';
  });
})();
</script>
